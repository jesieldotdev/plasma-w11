# "Sons do sistema": canal próprio para sons de notificação/alerta.
#
# Streams com media.role Notification/Alert vão para um sink virtual
# (loopback) e o volume desse sink é o controle "Sons do sistema" da bandeja.
# Diferente do volume por função (stream-restore), funciona mesmo quando o app
# define o próprio volume (libcanberra), porque o volume do sink multiplica o
# do stream. Baseado em wireplumber.conf.d.examples/media-role-nodes.conf.

wireplumber.profiles = {
  main = {
    policy.linking.role-based.loopbacks = required
  }
}

wireplumber.components = [
  {
    type = virtual, provides = policy.linking.role-based.loopbacks
    requires = [ loopback.sink.role.notification ]
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.name = "loopback.sink.role.notification"
      node.description = "Sons do sistema"
      capture.props = {
        media.class = Audio/Sink
        audio.position = [ FL, FR ]
        policy.role-based.target = true
        device.intended-roles = [ "Notification", "Alert", "alert", "Event", "event" ]
        policy.role-based.priority = 20
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
        # nunca escolher este sink como saída padrão
        priority.session = 1
        priority.driver = 1
      }
      playback.props = {
        # deixa a placa real suspender quando nenhum som do sistema toca
        node.passive = true
        # papel sem uso, para o loopback não ser roteado para si mesmo
        media.role = "Loopback"
      }
    }
    provides = loopback.sink.role.notification
    requires = [ support.export-core, pw.node-factory.adapter ]
  }
]
